<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Clean address: /page instead of /page.html */if(/\.html$/.test(location.pathname))history.replaceState(null,"",location.pathname.replace(/(index)?\.html$/,"")+location.search+location.hash)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a bug · Stroomdoos</title>
<meta name="description" content="Send a bug report for Primer to Stroomdoos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1f0ea">
<link rel="canonical" href="https://www.stroomdoos.com/bugreport">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&display=swap">
<link rel="stylesheet" href="/site.css">
<style>
.bug{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,112px);padding:clamp(48px,9vh,112px) 0 0;align-items:start}
.bug h1{font-size:clamp(52px,6.4vw,96px)}
.bug .lead{margin-top:28px;font-size:var(--t-lead);line-height:1.4;max-width:30ch}
.bug form .field:first-child{margin-top:0}
.bug .btn{margin-top:32px}
#status{margin-top:20px;font-weight:700;min-height:1.6em}
#status.err{color:#b43a32}
@media (max-width:900px){.bug{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="bar">
  <a class="word" href="/" aria-label="Stroomdoos home"><img src="/stroomdoos-woordmerk-kop.svg" width="2172" height="724" alt="Stroomdoos"></a>
  <nav class="links" aria-label="Main">
    <a href="/#how">How it works</a><a href="/#about">About</a><a href="/bugreport">Report a bug</a>
  </nav>
  <a class="btn btn-small" href="/#updates">Get updates</a>
</header>
<main class="bug">
<div>
<h1>Report a bug</h1>
<p class="lead">Found a problem in Primer? Tell us what you did and what happened.</p>
</div>
<div>
<form id="bug-form">
<div class="field-row">
<label class="field"><span>Primer version</span><input id="v-primer" name="primer" maxlength="40" placeholder="e.g. 0.84.3" autocomplete="off"></label>
<label class="field"><span>macOS version</span><input id="v-macos" name="macos" maxlength="40" placeholder="e.g. 26.1" autocomplete="off"></label>
<label class="field"><span>Logic version</span><input id="v-logic" name="logic" maxlength="40" placeholder="e.g. 12.0" autocomplete="off"></label>
</div>
<label class="field"><span>Your report</span><textarea id="report" name="report" required maxlength="51000" placeholder="What did you do? What happened? What did you expect?"></textarea></label>
<label class="field"><span>Email (optional, only if you want a reply)</span><input id="email" name="email" type="email" autocomplete="email"></label>
<button class="btn" id="send" type="submit">Send report</button>
</form>
<p id="status" role="status"></p>
</div>
</main>
</div>
<footer class="foot foot-dark">
  <div class="wrap">
    <img class="foot-word" src="/stroomdoos-woordmerk-licht.svg" width="1916" height="466" alt="Stroomdoos">
    <div class="foot-meta"><span>© 2026 Stroomdoos · <a href="/contact">Contact</a> · <a href="/bugreport">Report a bug</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></span></div>
  </div>
</footer>
<script>
const ENDPOINT = "https://primer-bugreports.empty-voice-4b54.workers.dev/report";
const form = document.getElementById("bug-form");
const status = document.getElementById("status");
const send = document.getElementById("send");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const report = document.getElementById("report").value.trim();
  const versions = [["Primer", "v-primer"], ["macOS", "v-macos"], ["Logic", "v-logic"]]
    .map(([name, id]) => [name, document.getElementById(id).value.trim()])
    .filter(([, value]) => value)
    .map(([name, value]) => `${name}: ${value}`);
  const body = report && (versions.length ? versions.join("\n") + "\n\n" : "") + report;
  const email = document.getElementById("email").value.trim();
  if (!body) return show("Please describe the problem first.", "err");
  send.disabled = true;
  show("Sending…", "");
  try {
    const response = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ body, email: email || undefined }),
    });
    if (response.status === 201) {
      form.reset();
      show("Thanks, your report is sent.", "ok");
    } else {
      show("Sorry, the report could not be sent. Please email support@stroomdoos.com instead.", "err");
    }
  } catch {
    show("Sorry, the report could not be sent. Check your connection, or email support@stroomdoos.com.", "err");
  } finally {
    send.disabled = false;
  }
});
function show(text, kind) {
  status.textContent = text;
  status.className = kind;
}
</script>
</body>
</html>

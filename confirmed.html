<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmed · Primer by Stroomdoos</title>
<meta name="description" content="Primer puts your multitrack WAV files on their own tracks in Logic Pro in one batch. Looking for beta testers.">
<meta property="og:title" content="Primer by Stroomdoos · Coming soon">
<meta property="og:url" content="https://www.stroomdoos.com/confirmed.html">
<meta property="og:image" content="https://www.stroomdoos.com/og.jpg">
<meta property="og:image:alt" content="The Primer app icon and main window">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stroomdoos">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<meta property="og:description" content="A Mac app that puts your multitrack WAVs into Logic Pro in one batch. Looking for beta testers.">
<meta name="theme-color" content="#f1f0ea">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--ground:#f1f0ea;--ink:#17191c;--soft:#5d5a52;--motif:#f04a2d;--pad:clamp(20px,5vw,64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 18px/1.55 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
h1,p{margin:0}
.wrap{padding:0 var(--pad);max-width:1400px;margin:0 auto;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:26px 0}
.word img{display:block;height:30px;width:auto}
.tag{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--motif)}
main{flex:1;display:flex;align-items:center}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:clamp(32px,6vw,96px);align-items:center;padding-top:clamp(48px,10vh,120px);padding-bottom:clamp(48px,10vh,120px)}
h1{font-weight:800;font-stretch:75%;letter-spacing:-.03em;line-height:.9;text-wrap:balance;font-size:clamp(56px,9vw,144px)}
h1 span{color:var(--motif)}
.lead{margin-top:32px;font-size:clamp(19px,1.8vw,26px);max-width:32ch;line-height:1.35}
.specs{margin-top:20px;font-size:15px;color:var(--soft)}
.strip{width:100%;max-width:360px;height:auto;justify-self:end}
.pill{display:inline-flex;align-items:center;padding:14px 24px;border-radius:999px;background:var(--ink);color:var(--ground);font-weight:700;text-decoration:none}
.signup{margin-top:clamp(36px,5vh,56px);max-width:560px}
.signup label{display:block;font-weight:700;font-size:17px;margin-bottom:10px}
.signup-row{display:flex;gap:10px;flex-wrap:wrap}
.signup input[type=email]{flex:1 1 240px;min-width:0;padding:14px 22px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:17px}
.signup input[type=email]:focus{outline:none;border-color:var(--motif)}
.signup button{border:0;cursor:pointer;font:inherit;font-weight:700}
.signup button[disabled]{opacity:.5;cursor:default}
.signup .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.signup-note{margin-top:12px;font-size:14px;color:var(--soft)}
.signup-msg{margin-top:14px;font-size:17px;font-weight:700}
.signup-msg.err{color:var(--motif)}
footer{padding:32px 0 40px}
.foot-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--soft)}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .strip{justify-self:start;max-width:200px;order:-1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="word" href="/" aria-label="Stroomdoos home"><img src="stroomdoos-woordmerk.svg" width="1600" height="389" alt="Stroomdoos"></a>
    <span class="tag">Coming soon</span>
  </header>
</div>
<main>
  <div class="wrap hero">
    <div>
      <h1>You're <span>in.</span></h1>
      <p class="lead">Thanks for confirming! I'll email you as soon as the Primer test version is ready.</p>
      <p class="signup"><a class="pill" href="/">Back to the site</a></p>
    </div>
    <img class="strip" src="stroomdoos-stekkerdoos.svg" width="720" height="713" alt="">
  </div>
</main>
<footer>
  <div class="wrap foot-meta">
    <span>© 2026 Stroomdoos · <a href="mailto:info@stroomdoos.com">info@stroomdoos.com</a> · <a href="mailto:support@stroomdoos.com">support@stroomdoos.com</a> · <a href="https://www.instagram.com/stroomdoos/" rel="me">Instagram</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></span>
    <span>Logic Pro is a trademark of Apple Inc. Primer is not affiliated with Apple.</span>
  </div>
</footer>
</body>
</html>
